<!-- templates/login.html -->
{% extends "base.html" %}
{% block title %}Login — InvestSmart{% endblock %}
{% block content %}
    <div class="form-box">
        <h1>Login</h1>
        <form method="post">
            {% csrf_token %}
            <p><label>Username</label><input type="text" name="username" required></p>
            <p><label>Password</label><input type="password" name="password" required></p>
            <button type="submit" class="btn-primary big">Login</button>
        </form>
        <p class="small">No account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
{% endblock %}
