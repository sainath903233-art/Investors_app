{% extends "base.html" %}

{% block title %}Login — InvestSmart{% endblock %}

{% block content %}

<div class="form-box">

<h1>Login</h1>

<form method="post">

    {% csrf_token %}

    <p>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="username"
            placeholder="Enter your email"
            required
        >
    </p>

    <p>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >
    </p>

    <button type="submit" class="btn-primary big">
        Login
    </button>

</form>

<p class="small">
    No account?
    <a href="{% url 'register' %}">Register here</a>
</p>


</div>

{% endblock %}
